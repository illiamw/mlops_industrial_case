resources:
  jobs:
    deployment_job:
      name: deployment_job

      tasks:
        - task_key: preprocess_data

          notebook_task:
            notebook_path: ../notebooks/01_pp_predata.ipynb

            base_parameters:
              catalog: dev

        - task_key: train_model
          depends_on:
            - task_key: preprocess_data
          notebook_task:
            notebook_path: ../notebooks/02_pp_train_models.ipynb

            base_parameters:
              catalog: dev

        - task_key: promote_model
          depends_on:
            - task_key: train_model
          notebook_task:
            notebook_path: ../notebooks/03_pp_promote.ipynb

            base_parameters:
              source_catalog: dev
              target_catalog: test
              schema: falha
              model: failure_predictor

        - task_key: produtionize_model
          depends_on:
            - task_key: promote_model
          notebook_task:
            notebook_path: ../notebooks/04_prodution.ipynb

            base_parameters:
              source_catalog: test
              target_catalog: prod
              schema: falha
              model: failure_predictor
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED